name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: System libraries for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
        env:
          NARDTRACE_OFFLINE: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:pages

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nardtrace:ci .
      - name: Smoke test container
        run: |
          docker run -d --name nt -p 8000:8000 -e NARDTRACE_OFFLINE=1 nardtrace:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 2; done
          curl -fsS -X POST localhost:8000/api/demo/seed
          curl -fsS localhost:8000/api/cases/1/report.pdf -o report.pdf
          head -c 4 report.pdf | grep -q '%PDF'
